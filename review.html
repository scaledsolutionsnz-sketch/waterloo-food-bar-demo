<!DOCTYPE html>
<html lang="en-NZ">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leave a Review | Waterloo Food Bar</title>
<meta name="description" content="Enjoyed your feed from Waterloo Food Bar? Leave us a quick review.">
<meta name="theme-color" content="#1c1815">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="96x96" href="/favicon-96.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@500;600;700&family=Schibsted+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="review-wrap">
  <div class="review-card">
    <div class="dot">W</div>
    <h1>How was your feed?</h1>
    <p>Tap a rating below, it only takes a second and it really helps a small local takeaway.</p>
    <div class="star-pick" id="stars">
      <button data-rating="5" aria-label="5 stars">★</button>
      <button data-rating="4" aria-label="4 stars">★</button>
      <button data-rating="3" aria-label="3 stars">★</button>
      <button data-rating="2" aria-label="2 stars">★</button>
      <button data-rating="1" aria-label="1 star">★</button>
    </div>
    <p class="review-hint">Choose 1 to 5 stars</p>
    <a class="back-link" href="index.html">Back to Waterloo Food Bar</a>
  </div>
</div>
<script>
  // 4-5 stars Google review; 1-3 private feedback form
  var GOOGLE_REVIEW_URL = "https://g.page/r/PLACEHOLDER";
  document.querySelectorAll('#stars button').forEach(function(btn){
    btn.addEventListener('click', function(){
      var r = parseInt(btn.getAttribute('data-rating'), 10);
      if (r >= 4) { window.location.href = GOOGLE_REVIEW_URL; }
      else { window.location.href = 'private.html?rating=' + r; }
    });
  });
</script>
</body>
</html>
